# Lean build check: at every change, GitHub rebuilds EVERY Lean proof in this repository (each folder <paper>/lean/, or
# lean/ at the top) on a fresh machine, so a reader sees "passing" without installing Lean.
# Copyright (C) Dave Goel 2026--now. Licensed under the Apache License 2.0; see LICENSE.
name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  find-projects:
    runs-on: ubuntu-24.04
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: find
        run: |
          projects=$(find . -mindepth 2 -maxdepth 3 \( -path './lean/lakefile.toml' -o -path './*/lean/lakefile.toml' \) -printf '%h\n' | sed 's#^\./##' | sort | jq -R . | jq -cs .)
          echo "Lean projects: $projects"
          [ "$projects" != "[]" ] || { echo "no lean/lakefile.toml found"; exit 1; }
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  build:
    needs: find-projects
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.find-projects.outputs.projects) }}
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Swap space (10 GB for private runner headroom; measured single-thread peak 8.09 GB overall, 7.71 GB Statements.lean)
        run: |
          free -m
          df -h / /mnt
          root_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          mnt_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          if [ "$(stat -c %d /mnt)" != "$(stat -c %d /)" ] && [ "$mnt_gb" -ge 11 ]; then
            swap_file=/mnt/swapfile_build
          else
            [ "$root_gb" -ge 25 ] || { echo "only ${root_gb} GB free on / and too little on /mnt for 10 GB swap"; exit 1; }
            swap_file=/swapfile_build
          fi
          echo "swap file: $swap_file"
          sudo fallocate -l 10G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          free -m

      - name: Install Lean and fetch Mathlib cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6  # v1.6.2
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: ${{ matrix.project }}
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false
          build: false
          test: false
          lint: false

      - name: Policy check and audit (AUDIT.md regenerated)
        working-directory: ${{ matrix.project }}
        run: |
          sudo apt-get install -y ripgrep
          if [ -f scripts/ci_check.sh ]; then
            echo "running the project's scripts/ci_check.sh"
            bash scripts/ci_check.sh
          else
            bash scripts/check.sh
          fi

      - name: The published AUDIT.md is exactly what Lean reports
        working-directory: ${{ matrix.project }}
        run: |
          git ls-files --error-unmatch AUDIT.md > /dev/null || { echo "AUDIT.md is not in the repository: nothing to compare"; exit 1; }
          git diff --exit-code -- AUDIT.md
