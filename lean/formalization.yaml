version: v0.4
project:
  name: "How fast Smale's mean value constants (1981) approach 4"
  description: "Lean 4 formalization of the main upper bounds in \"How fast Smale's mean value constants (1981) approach 4\" (Dave Goel, v1.00): conditional Theorem 1.1 (K(d) <= (4/y) exp(-mu(y^(1/d)))) and Corollary 1.2 (K(d) < 4 - 4/log d for all d >= 8) given four explicit hypotheses (Betsakos 2013 Theorem 1.1, NIST DLMF 19.9.5, JordanCurveFact, and CoefficientUpperFact), conditional Proposition 3.4 asymptotic and explicit upper bounds given DLMF 19.9.5, and the unconditional finite Table 3 and majorant bounds for 8 <= d <= 20. All five registry targets use only Lean's three standard axioms. Across the full paper suite, standard lake comparator accepted 257 selected declarations while 34 declarations remain open (including unconditional forms of Theorem 1.1 and Corollary 1.2 and expanded-only Sections 4–5 bounds)."
