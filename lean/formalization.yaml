    tool_setup: AI agents prepared and checked the Lean proof under the author’s direction.
fidelity:
  divergences: Theorem 1.1 and Corollary 1.2 are stated in explicitly conditional form binding the four cited/background inputs (Betsakos 2013 Theorem 1.1, NIST DLMF 19.9.5, JordanCurveFact, and CoefficientUpperFact) as explicit Prop hypotheses rather than custom axioms; Proposition 3.4 binds NIST DLMF 19.9.5 explicitly; the Table 3 and majorant target is unconditional. Unconditional forms of Theorem 1.1 and Corollary 1.2 and the expanded-only Sections 4–5 bounds remain open (34 open rows in the full paper suite).
review:
  status: agent-reviewed
  reviewers:
  - Google Gemini
  notes: An independent Google Gemini check matched all five registry targets to the paper and verified the Lean proofs. Independent Lean verification of the five standard-axiom registry targets (conditional Theorem 1.1, Corollary 1.2, Proposition 3.4, and unconditional Table 3 degrees 8–20) passed clean build, kernel replay, and standard and paranoid lake comparator checks on top of the 257-target paper comparator check; 34 declarations remain open.
alignment:
  namespace: SmaleRate.Registry
  statements:
  - source: Theorem 1.1 (conditional)
    lean: SmaleRate.Registry.thm_1_1_conditional
    module: RegistryChallenge
    status: proved
    note: For every degree d >= 2 and y in (0, 1), K(d) <= (4/y) exp(-mu(y^(1/d))) given JordanCurveFact, CoefficientUpperFact, Betsakos2013Fact, and DLMF1995Fact.
  - source: Corollary 1.2 (conditional)
    lean: SmaleRate.Registry.cor_1_2_conditional
    module: RegistryChallenge
    status: proved
    note: For every degree d >= 8, K(d) < 4 - 4/log d given JordanCurveFact, CoefficientUpperFact, Betsakos2013Fact, and DLMF1995Fact.
  - source: Proposition 3.4 (limit, conditional)
    lean: SmaleRate.Registry.prop_3_4_limit_conditional
    module: RegistryChallenge
    status: proved
    note: (4 - B(d)) log d converges to 2 pi^2 as d -> infinity, given DLMF1995Fact alone.
  - source: Proposition 3.4 (upper bound, conditional)
    lean: SmaleRate.Registry.prop_3_4_upper_conditional
    module: RegistryChallenge
    status: proved
    note: Explicit upper bound (4 - B(d)) log d <= 2 pi^2 / (1 - pi^2 / (d (log d)^2)) for all d >= 8, given DLMF1995Fact alone.
  - source: Corollary 1.2 Steps 2–3 and Table 3 (unconditional)
    lean: SmaleRate.Registry.cor_1_2_table3_and_majorant
    module: RegistryChallenge
    status: proved
    note: Unconditional standard-axiom proof that majorant(d) <= target(d) for all d >= 8 and strictly majorant(d) < target(d) for all thirteen finite Table 3 degrees 8 <= d <= 20.
