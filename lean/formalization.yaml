status:
  scope: The five compared registry targets formalize conditional Theorem 1.1 and Corollary 1.2 (with all four cited/background assumptions—Betsakos 2013 Theorem 1.1, NIST DLMF 19.9.5, planar Jordan–Schoenflies topology JordanCurveFact, and exterior conformal-map coefficient bound CoefficientUpperFact—made explicit Prop hypotheses), conditional Proposition 3.4 limit and explicit upper bound (given DLMF 19.9.5 alone), and the unconditional majorant and Table 3 finite bounds for degrees 8 <= d <= 20. All five targets depend strictly on Lean's three standard axioms (zero custom axioms). Across the full repository suite (291 audited paper declarations), 257 selected statements passed standard lake comparator while 34 declarations remain open (including unconditional Theorem 1.1 and Corollary 1.2 and expanded-only Sections 4–5 bounds).
